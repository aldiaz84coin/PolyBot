# ──────────────────────────────────────────────────────────────
#  Polymarket BTC Bot — Configuración v12.0
#  Copia a config.yaml y rellena tus valores reales
# ──────────────────────────────────────────────────────────────

# ── Estrategia direccional (UP/DOWN) ──────────────────────────
strategy:
  t20_umbral_usd:      500    # distancia mínima al target para entrar en T-20
  t15_umbral_usd:      300    # distancia mínima al target para entrar en T-15
  t10_umbral_usd:      200    # distancia mínima al target para entrar en T-10
  t5_umbral_usd:       150    # distancia mínima al target para entrar en T-5
  stop_loss_pct:        10    # stop loss: salir si la posición pierde este %
  min_retorno_pct:     2.5    # retorno mínimo estimado para entrar (0 = desactivado)
                               #   retorno = (1/odds - 1) * 100
                               #   ej: odds=0.60 → retorno 66.7% ✅ (si min=2.5)
                               #       odds=0.97 → retorno  3.1% ❌ (si min=5.0)
  simulate_mode:       true   # true = no ejecuta órdenes reales
                               # Se sobreescribe desde dashboard (Supabase bot_config)

# ── Capital ────────────────────────────────────────────────────
capital:
  stake_usdc:          10     # USDC por operación (estrategia direccional)
  max_operaciones_dia: 24     # límite diario de entradas

# ── Estrategia de arbitraje (UP/DOWN par) ─────────────────────
# Corre en paralelo como hilo daemon. Completamente independiente
# del bot direccional en modo y capital.
arb_strategy:

  # Activación
  enabled:             false  # true = activa al arrancar el bot
                               # Se puede sobreescribir desde dashboard (Supabase)
                               # sin redeploy: arb_enabled = "true" en bot_config

  # Modo de operación (independiente del bot principal)
  simulate_mode:       true   # true = no ejecuta órdenes reales
                               # Se puede cambiar desde dashboard (Supabase)

  # Capital por pata (inversión total por par = stake_per_leg_usdc × 2)
  stake_per_leg_usdc:  5.0    # USDC invertidos en CADA pata del par

  # Umbral de entrada para la primera pata
  # Precio de 0.48 = mercado da ~48% al lado comprado
  # Solo comprar si el token está por debajo de este precio
  entry_threshold:     0.48   # [0.01 – 0.50]

  # Umbral de par en Fase 1 (60→30 min): coste total proyectado ≤ umbral
  # pair_cost = up_price + down_price < 1.00 → ganancia garantizada
  # Umbral 0.98 = margen de seguridad del 2%
  pair_threshold_phase1: 0.98  # [0.90 – 0.999]

  # Umbral de par en Fase 2 (30→15 min): más relajado porque el tiempo apremia
  pair_threshold_phase2: 0.99  # [0.90 – 0.999]

# ── Monitor ────────────────────────────────────────────────────
monitor:
  interval_s:          30     # segundos entre ciclos fuera de ventana activa
  max_ops_per_day:      4     # máximo de operaciones diarias (direccional)
  t5_sl_interval_s:     1     # intervalo en T-5 con posición abierta (segundos)

# ── Polymarket ─────────────────────────────────────────────────
polymarket:
  private_key:    "0x..."       # ⚠ nunca compartir — usar env var en Railway
  funder:         "0x..."       # dirección proxy de Polymarket
  signature_type: 2             # 2 = MetaMask / EOA
  chain_id:       137           # Polygon mainnet
  api_key:        "..."         # Level 2 credentials
  api_secret:     "..."
  api_passphrase: "..."

# ── Telegram ───────────────────────────────────────────────────
telegram:
  bot_token:           "..."
  chat_id:             "..."
  notificar_entrada:   true
  notificar_salida:    true
  notificar_stop_loss: true

# ── Supabase (persistencia compartida bot ↔ dashboard) ─────────
supabase:
  url:         ""   # https://xxx.supabase.co — usar env var SUPABASE_URL
  service_key: ""   # service_role key         — usar env var SUPABASE_SERVICE_KEY

# ── Logging ────────────────────────────────────────────────────
logging:
  nivel:        "INFO"
  archivo:      "logs/bot.log"
  csv_path:     "logs/operaciones.csv"       # CSV backup estrategia direccional
  arb_csv_path: "logs/operaciones_arb.csv"   # CSV backup estrategia ARB
