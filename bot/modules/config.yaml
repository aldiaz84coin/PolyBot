# ──────────────────────────────────────────────────────────────
#  Polymarket BTC Bot — Configuración
#  Copia a config.yaml y rellena tus valores reales
# ──────────────────────────────────────────────────────────────

strategy:
  t20_umbral_usd: 400     # umbral ventana T-20min (500)
  t15_umbral_usd: 250     # umbral ventana T-15min (300)
  t10_umbral_usd: 180     # umbral ventana T-10min (250)
  t5_umbral_usd:  150     # umbral ventana T-5min  (150)
  stop_loss_pct:  50    # stop loss: salir si el movimiento BTC supera este %
  monitor_intervalo_s: 5  # frecuencia del loop fuera de ventana T-5 (segundos)
  t5_sl_intervalo_s:   1  # v8.0: frecuencia en T-5 con posición abierta (segundos)
  min_retorno_pct:  2.5  # v8.0: retorno mínimo estimado para entrar (0 = desactivado)
                          #   retorno = (1/odds - 1) * 100
                          #   ej: odds=0.60 → retorno 66.7%  ✅ (si min=20)
                          #       odds=0.85 → retorno 17.6%  ❌ (si min=20)

capital:
  stake_usdc:        10   # USDC por operación
  max_operaciones_dia: 24

polymarket:
  private_key:    "0x..."       # ⚠ nunca compartir
  funder:         "0x..."       # dirección proxy de Polymarket
  signature_type: 2             # 2 = MetaMask
  chain_id:       137           # Polygon mainnet
  api_key:        "..."
  api_secret:     "..."
  api_passphrase: "..."

telegram:
  bot_token:          "..."
  chat_id:            "..."
  notificar_entrada:  true
  notificar_salida:   true
  notificar_stop_loss: true

logging:
  nivel:          "DEBUG"
  archivo:        "logs/bot.log"
  historial_csv:  "logs/operaciones.csv"
